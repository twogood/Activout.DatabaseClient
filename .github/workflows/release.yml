name: Release

on:
  release:
    types: [created]

permissions:
  contents: write # upload packages to the GitHub release
  id-token: write # GitHub OIDC token for NuGet trusted publishing and provenance attestations
  attestations: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      # Packs every packable project; test projects set IsPackable=false.
      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack \
            --configuration Release --no-build \
            -p:PackageVersion="$VERSION" \
            -o artifacts

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      # Keyless Sigstore provenance; verify with: gh attestation verify <file>.nupkg -R twogood/Activout.DatabaseClient
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Upload packages to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      # Exchange the OIDC token for a short-lived (1 hour) API key right before pushing.
      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Also pushes the matching .snupkg symbol packages.
      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
