name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [ '8.0.x', '9.0.x', '10.0.x' ]

    steps:
      - uses: actions/checkout@v4
      - name: Setup dotnet ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        id: stepid
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      #      - name: Create temporary global.json
      #        run: echo '{"sdk":{"version":"${{ steps.stepid.outputs.dotnet-version }}"}}' > ./global.json
      - name: Display dotnet version
        run: dotnet --version
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration=Release --no-restore
      - name: Test
        run: dotnet test --configuration=Release --no-build
      - name: Pack NuGet packages (PR validation)
        if: matrix.dotnet-version == '8.0.x' && github.event_name == 'pull_request'
        run: |
          for PROJECT in Activout.DatabaseClient Activout.DatabaseClient.Dapper; do
            dotnet pack "$PROJECT/$PROJECT.csproj" \
              -p:PackageVersion=1.0.0-pr${{ github.event.pull_request.number }}.${{ github.run_number }} \
              --configuration=Release \
              --no-build \
              --include-symbols \
              --include-source
          done
      - name: Upload NuGet packages
        if: matrix.dotnet-version == '8.0.x' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-pr${{ github.event.pull_request.number }}-run${{ github.run_number }}
          path: |
            **/*.symbols.nupkg
